# Builds the site and publishes it on GitHub Pages after every change to "main".
# One-time setup: Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every night at about midnight in Melbourne, so finished events move from "Upcoming" to "Past".
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the comment and post store
        run: npm run test:store

      - name: Build
        env:
          # "https://<organisation>.github.io" now, "https://internetobservatory.org.au" after the domain switch
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # "/aio-website" now, "" after the domain switch: nothing else has to change
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Check links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5

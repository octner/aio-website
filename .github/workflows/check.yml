# Builds every proposed change (pull request) without publishing it.
# A post with a missing title or a wrong date fails here, before anybody merges it.
name: Check a proposed change

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:store
      - run: npm run build
        env:
          BASE_PATH: /aio-website
      - run: npm run check
        env:
          BASE_PATH: /aio-website

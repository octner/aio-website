<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 556" width="560" height="556" role="img" aria-label="Six steps of a data donation: the participant reads the briefing and consents, requests their data from the platform, waits for the archive, uploads it, reviews it and chooses what to share, and donates the selected data." class="diagram diagram-process"><title>Six steps of a data donation: the participant reads the briefing and consents, requests their data from the platform, waits for the archive, uploads it, reviews it and chooses what to share, and donates the selected data.</title><g class="step" data-step="1"><circle cx="56.0" cy="66.0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><g transform="translate(40.10 50.10) scale(1.3250)" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/><path d="M8 13h8"/><path d="M8 17h5"/><path d="M8 9h2"/></g><circle cx="78.2" cy="43.8" r="12" fill="#0f172a"/><text x="78.2" y="48.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text><text x="112.0" y="58.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Brief and consent</tspan></text><text x="112.0" y="80.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">The participant reads the study briefing and</tspan><tspan x="112.0" dy="18.9">consents</tspan></text></g><g class="conn" data-step="2"><path d="M56.0 104.0 L56.0 114.0 M52.0 107.1 L56.0 114.0 L60.0 107.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="step" data-step="2"><circle cx="56.0" cy="154.0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><g transform="translate(40.10 138.10) scale(1.3250)" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/><path d="M10 5h1"/><path d="M9 7.5h1"/><path d="M10 10h1"/><path d="M9 12.5h1"/><rect x="8.25" y="15" width="3.5" height="4" rx="1"/></g><circle cx="78.2" cy="131.8" r="12" fill="#0f172a"/><text x="78.2" y="136.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text><text x="112.0" y="146.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Request</tspan></text><text x="112.0" y="168.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">They request their data from the platform</tspan></text></g><g class="conn" data-step="3"><path d="M56.0 192.0 L56.0 200.0 M52.0 193.1 L56.0 200.0 L60.0 193.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="step" data-step="3"><circle cx="56.0" cy="240.0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><g transform="translate(40.10 224.10) scale(1.3250)" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22"/><path d="M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></g><circle cx="78.2" cy="217.8" r="12" fill="#0f172a"/><text x="78.2" y="222.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text><text x="112.0" y="232.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Wait</tspan></text><text x="112.0" y="254.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">Minutes on some platforms, days on others</tspan></text></g><g class="conn" data-step="4"><path d="M56.0 278.0 L56.0 286.0 M52.0 279.1 L56.0 286.0 L60.0 279.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="step" data-step="4"><circle cx="56.0" cy="326.0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><g transform="translate(40.10 310.10) scale(1.3250)" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></g><circle cx="78.2" cy="303.8" r="12" fill="#0f172a"/><text x="78.2" y="308.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text><text x="112.0" y="318.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Upload</tspan></text><text x="112.0" y="340.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">They upload the archive for the study</tspan></text></g><g class="conn" data-step="5"><path d="M56.0 364.0 L56.0 372.0 M52.0 365.1 L56.0 372.0 L60.0 365.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="step" data-step="5"><circle cx="56.0" cy="412.0" r="30" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/><g transform="translate(40.10 396.10) scale(1.3250)" fill="none" stroke="#9a3412" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m7 8 1.5 1.5L11 7"/><path d="M13.5 8.5H17"/><path d="m7 14 1.5 1.5L11 13"/><path d="M13.5 14.5H17"/></g><circle cx="78.2" cy="389.8" r="12" fill="#0f172a"/><text x="78.2" y="394.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text><text x="112.0" y="404.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Review</tspan></text><text x="112.0" y="426.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">They see their own data and untick what they</tspan><tspan x="112.0" dy="18.9">keep back</tspan></text></g><g class="conn" data-step="6"><path d="M56.0 450.0 L56.0 460.0 M52.0 453.1 L56.0 460.0 L60.0 453.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="step" data-step="6"><circle cx="56.0" cy="500.0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><g transform="translate(40.10 484.10) scale(1.3250)" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"/><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 15 6 6"/><rect x="14" y="2" width="7" height="6" rx="1.2"/><path d="M16.5 5h2"/></g><circle cx="78.2" cy="477.8" r="12" fill="#0f172a"/><text x="78.2" y="482.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text><text x="112.0" y="492.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Donate</tspan></text><text x="112.0" y="514.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">Only the selected data reaches the researcher</tspan></text></g></svg>

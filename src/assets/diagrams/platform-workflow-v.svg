<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 474" width="560" height="474" role="img" aria-label="The five stages of a study on the AIO platform: create the project, configure it (uploaders, participant codes, research team, ethics and test mode), share the donation URL, participants donate, and analyse the donated data." class="diagram diagram-process"><title>The five stages of a study on the AIO platform: create the project, configure it (uploaders, participant codes, research team, ethics and test mode), share the donation URL, participants donate, and analyse the donated data.</title><g class="step" data-step="1"><circle cx="56.0" cy="66.0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><g transform="translate(40.10 50.10) scale(1.3250)" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/><path d="M12 10v6"/><path d="M9 13h6"/></g><circle cx="78.2" cy="43.8" r="12" fill="#0f172a"/><text x="78.2" y="48.0" text-anchor="middle" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text><text x="112.0" y="58.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#020617" text-anchor="start"><tspan x="112.0" dy="0.0">Create project</tspan></text><text x="112.0" y="80.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="112.0" dy="0.0">Name, project type and contact information</tspan></text></g><g class="conn" data-step="2"><path d="M56.0 104.0 L56.0 112.0 M52.0 105.1 L56.0 112.0 L60.0 105.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="step" data-step="2"><circle cx="56.0" cy="152
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 619" width="560" height="619" role="img" aria-label="A comparison of platform-centric and user-centric methods: where the data comes from, what it shows, what it misses, who controls access and typical tools." class="diagram diagram-compare"><title>A comparison of platform-centric and user-centric methods: where the data comes from, what it shows, what it misses, who controls access and typical tools.</title><rect x="16" y="8" width="528" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="56" cy="48" r="24" fill="#0f172a"/><g transform="translate(44.00 36.00) scale(1.0000)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="13" height="7.5" rx="2"/><rect x="2" y="13.5" width="13" height="7.5" rx="2"/><path d="M5.5 6.75h.01"/><path d="M5.5 17.25h.01"/><path d="M17.5 12h4.5"/><path d="m20 9.5 2.5 2.5L20 14.5"/></g><text x="92.0" y="44.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#020617" text-anchor="start"><tspan x="92.0" dy="0.0">Platform-centric</tspan></text><text x="92.0" y="66.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="92.0" dy="0.0">Data collected from the platform</tspan></text><text x="36.0" y="100.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">SOURCE</tspan></text><text x="36.0" y="119.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">APIs, dashboards, web archiving, scraping</tspan></text><text x="36.0" y="149.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">SHOWS</tspan></text><text x="36.0" y="168.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">Public content at scale</tspan></text><text x="36.0" y="198.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">MISSES</tspan></text><text x="36.0" y="217.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">Personalised feeds, private activity</tspan></text><text x="36.0" y="247.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">ACCESS</tspan></text><text x="36.0" y="266.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">Set by the platform</tspan></text><rect x="16" y="304" width="528" height="299" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="56" cy="344" r="24" fill="#0f172a"/><g transform="translate(44.00 332.00) scale(1.0000)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16.5 12H22"/><path d="m19.5 9.5 2.5 2.5-2.5 2.5"/></g><text x="92.0" y="340.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#020617" text-anchor="start"><tspan x="92.0" dy="0.0">User-centric</tspan></text><text x="92.0" y="362.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="92.0" dy="0.0">Data collected with participants</tspan></text><text x="36.0" y="396.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">SOURCE</tspan></text><text x="36.0" y="415.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">Data donation: DDPs, screen tracking,</tspan><tspan x="36.0" dy="19.5">browser extension</tspan></text><text x="36.0" y="464.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">SHOWS</tspan></text><text x="36.0" y="483.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">What individuals actually saw and did</tspan></text><text x="36.0" y="513.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">MISSES</tspan></text><text x="36.0" y="532.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">People who did not take part</tspan></text><text x="36.0" y="562.0" font-family="&#x27;Space Grotesk&#x27;, &#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start"><tspan x="36.0" dy="0.0">ACCESS</tspan></text><text x="36.0" y="581.0" font-family="&#x27;Inter Tight&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="36.0" dy="0.0">Given by each participant</tspan></text></svg>
